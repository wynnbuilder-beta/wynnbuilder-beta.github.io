<!DOCTYPE html>
<html scroll-behavior="smooth" style="height: 100%">
    <head>
        <!-- nunito font, copying wynndata -->
        <link rel="preconnect" href="https://fonts.gstatic.com">
        <link href="https://fonts.googleapis.com/css2?family=Nunito&display=swap" rel="stylesheet">

        <link rel="icon" href="./media/memes/agony.png">
        <link rel="manifest" href="manifest.json">
        <title>Base DPS Visualizer</title>
        <link rel="stylesheet" href="/src/lib/styles/common.css">
        <link rel="stylesheet" href="/src/lib/styles/dps_vis.css">
        <script type="module" src="/src/entries/dps_vis.ts"></script>
    </head>
    <body class="all" style="height: 95%; overflow: auto; display: flex; flex-direction: column">
        <header class="header nomarginp">
            <div class="headerleft" id = "headerleft">
            </div>
            <div class="headercenter" id = "headercenter">
                <div>
                    <p class="itemp" id="header">Base DPS Visualization</p>
                </div>
            </div>
            <div class="headerright" id = "headerright">
            </div>
        </header>
        <table style="padding-bottom:20px">
            <tr>
                <td>
                    <button class = "button-narrow" id = "wand">
                        wands
                    </button>
                </td>
                <td>
                    <button class = "button-narrow" id = "spear">
                        spears
                    </button>
                </td>
                <td>
                    <button class = "button-narrow" id = "dagger">
                        daggers
                    </button>
                </td>
                <td>
                    <button class = "button-narrow" id = "bow">
                        bows
                    </button>
                </td>
                <td>
                    <button class = "button-narrow" id = "relik">
                        reliks
                    </button>
                </td>
                <td>
                </td>
                <td>
                    <button class = "button-narrow" id = "powderToggle">
                        prepowder (true)
                    </button>
                </td>
                <td>
                    <label class = "button-narrow" for="versionDropdown">Change Version</label>
                    <select class = "button-narrow" id = "versionDropdown">
                    </select>
                </td>
            </tr>
        </table>
        <p id="info">
            SELECTED ITEM TYPE: wand
        </p>
    </body>
</html>
